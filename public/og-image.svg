<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Badge -->
  <rect x="100" y="90" width="180" height="40" rx="20" fill="#052e16" stroke="#166534" stroke-width="2" />
  <text x="190" y="115" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#4ade80" text-anchor="middle">LOCAL AI</text>

  <!-- Title -->
  <text x="100" y="210" font-family="system-ui, sans-serif" font-size="80" font-weight="900" fill="#ffffff" letter-spacing="-2">CUTOUT</text>

  <!-- Taglines -->
  <text x="100" y="290" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="url(#accent)">Remove backgrounds.</text>
  <text x="100" y="345" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="#e2e8f0">Keep your photos private.</text>

  <!-- Key points -->
  <text x="100" y="440" font-family="system-ui, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">
    No upload • No account • No watermark
  </text>

  <!-- Runtime -->
  <rect x="100" y="490" width="220" height="48" rx="12" fill="#1e293b" stroke="#334155" />
  <text x="210" y="522" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#38bdf8" text-anchor="middle">WebGPU + WASM</text>
</svg>
