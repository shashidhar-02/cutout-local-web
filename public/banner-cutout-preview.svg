<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <!-- Checkerboard pattern for transparent side -->
    <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f8fafc" />
      <rect x="12" width="12" height="12" fill="#e2e8f0" />
      <rect y="12" width="12" height="12" fill="#e2e8f0" />
      <rect x="12" y="12" width="12" height="12" fill="#f8fafc" />
    </pattern>

    <!-- Studio Backdrop for Original side -->
    <linearGradient id="studio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#312e81" />
      <stop offset="80%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="bokeh-1" cx="30%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh-2" cx="70%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Subject Gradients (Sleek High-End Sneaker & Studio Product Subject) -->
    <linearGradient id="sneaker-body" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <linearGradient id="sneaker-swoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="sneaker-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <filter id="shadow-drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>

    <!-- Clip path for original half -->
    <clipPath id="left-half-clip">
      <rect x="0" y="0" width="600" height="560" />
    </clipPath>

    <!-- Clip path for cutout half -->
    <clipPath id="right-half-clip">
      <rect x="600" y="0" width="600" height="560" />
    </clipPath>
  </defs>

  <!-- BACKGROUNDS -->
  <!-- Left Side: Original Complex Vibrant Studio Background -->
  <g clip-path="url(#left-half-clip)">
    <rect width="1200" height="560" fill="url(#studio-bg)" />
    <!-- Floating Bokeh Particles -->
    <circle cx="180" cy="140" r="120" fill="url(#bokeh-1)" />
    <circle cx="450" cy="380" r="160" fill="url(#bokeh-2)" />
    <circle cx="280" cy="460" r="90" fill="#f43f5e" opacity="0.35" filter="blur(30px)" />
    <circle cx="100" cy="340" r="70" fill="#38bdf8" opacity="0.4" filter="blur(20px)" />

    <!-- Studio Grid Line details in background -->
    <path d="M 0,280 Q 300,180 600,280" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" fill="none" />
    <path d="M 0,360 Q 300,260 600,360" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1" fill="none" />
  </g>

  <!-- Right Side: Clean Alpha Checkerboard (Transparent Background) -->
  <g clip-path="url(#right-half-clip)">
    <rect x="600" y="0" width="600" height="560" fill="url(#checker)" />
  </g>

  <!-- THE SUBJECT: RENDERED ACROSS BOTH HALVES (Demonstrating Instant Edge Masking) -->
  <g id="main-subject" transform="translate(600, 280) scale(1.15)">
    <!-- Contact Soft Ground Shadow -->
    <ellipse cx="-20" cy="115" rx="240" ry="24" fill="#0f172a" opacity="0.32" filter="blur(16px)" />

    <!-- Sneaker Outsole -->
    <path d="M -230,95 C -180,95 -120,105 10,102 C 100,100 170,108 220,95 C 240,90 250,75 235,55 C 210,25 180,20 140,25 C 100,30 30,25 -20,28 C -90,32 -160,20 -210,35 C -245,45 -255,85 -230,95 Z"
          fill="#1e293b" filter="url(#shadow-drop)" />

    <!-- Midsole (Sculpted Air Cushion & Foam) -->
    <path d="M -225,82 C -170,82 -110,88 15,86 C 105,84 175,90 215,80 C 232,75 240,65 230,50 C 205,30 175,25 140,30 C 100,35 30,30 -20,33 C -90,37 -160,28 -205,40 C -235,50 -240,75 -225,82 Z"
          fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
    
    <!-- Foam Cushion Details / Accents -->
    <path d="M -160,78 C -110,80 -60,82 -10,82 C 40,82 90,80 140,76" stroke="#059669" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="165" cy="65" r="8" fill="#10b981" />
    <circle cx="185" cy="63" r="8" fill="#10b981" />

    <!-- Sneaker Upper Body (Ergonomic curves) -->
    <path d="M -210,38 C -170,30 -110,15 -50,-40 C -15,-70 30,-110 80,-125 C 105,-132 125,-120 120,-95 C 115,-75 100,-45 95,-20 C 125,-10 165,10 200,25 C 215,32 215,45 200,52 C 160,65 80,60 0,60 C -80,60 -150,55 -210,38 Z"
          fill="url(#sneaker-body)" stroke="#cbd5e1" stroke-width="2" />

    <!-- Quarter Panel & Vibrant Swoosh -->
    <path d="M -90,-10 C -40,-35 40,-45 110,-10 C 115,-8 112,-2 105,-3 C 45,-12 -30,5 -75,22 C -85,25 -92,15 -90,-10 Z"
          fill="url(#sneaker-accent)" opacity="0.9" />

    <path d="M -140,15 C -80,-5 10,-35 90,-5 C 140,15 70,35 -20,28 C -70,24 -115,30 -140,15 Z"
          fill="url(#sneaker-swoosh)" filter="url(#shadow-drop)" />

    <!-- Collar & Tongue -->
    <path d="M 50,-85 C 65,-105 85,-115 100,-115 C 115,-115 118,-95 110,-75 C 95,-45 80,-25 70,-10 Z"
          fill="#334155" />
    <path d="M 25,-70 C 45,-85 65,-95 80,-95" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 5,-45 C 30,-60 55,-70 70,-70" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M -15,-20 C 15,-35 40,-45 55,-45" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Heel Tab -->
    <path d="M 105,-100 C 125,-105 135,-85 130,-60 C 125,-35 115,-10 105,10" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>

  <!-- CENTER SPLIT DIVIDER & FLOATING INTERACTIVE CONTROLLER -->
  <line x1="600" y1="0" x2="600" y2="560" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 6" opacity="0.9" />
  <line x1="600" y1="0" x2="600" y2="560" stroke="#10b981" stroke-width="2" opacity="0.8" />

  <!-- Center Badge Indicator -->
  <g transform="translate(600, 280)">
    <circle cx="0" cy="0" r="26" fill="#ffffff" filter="url(#shadow-drop)" stroke="#10b981" stroke-width="3" />
    <path d="M -8,0 L -3,-5 L -3,-2 L 3,-2 L 3,-5 L 8,0 L 3,5 L 3,2 L -3,2 L -3,5 Z" fill="#0f172a" />
  </g>

  <!-- LABEL BADGES -->
  <!-- Left Side Label: Original Photo -->
  <g transform="translate(60, 48)">
    <rect width="210" height="42" rx="21" fill="#0f172a" fill-opacity="0.75" />
    <circle cx="26" cy="21" r="8" fill="#f43f5e" />
    <text x="46" y="26" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">ORIGINAL PHOTO</text>
  </g>

  <!-- Right Side Label: Transparent Cutout -->
  <g transform="translate(850, 48)">
    <rect width="290" height="42" rx="21" fill="#047857" fill-opacity="0.92" filter="url(#shadow-drop)" />
    <circle cx="26" cy="21" r="8" fill="#34d399" />
    <text x="46" y="26" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">CUTOUT • TRANSPARENT PNG</text>
  </g>

  <!-- BOTTOM FLOATING HIGHLIGHTS -->
  <g transform="translate(60, 490)">
    <rect width="260" height="34" rx="17" fill="#000000" fill-opacity="0.6" />
    <text x="20" y="22" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Complex Background & Lighting</text>
  </g>

  <g transform="translate(880, 490)">
    <rect width="260" height="34" rx="17" fill="#0f172a" fill-opacity="0.75" />
    <text x="20" y="22" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">⚡ 100% On-Device Alpha Mask</text>
  </g>
</svg>
